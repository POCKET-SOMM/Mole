name: Validation

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_ANALYTICS: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  GOTOOLCHAIN: local
  MOLE_TEST_NO_AUTH: "1"
  MOLE_SKIP_FINDER_TESTS: "1"
  BATS_FORMATTER: tap
  TERM: xterm-256color
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8

jobs:
  packages:
    name: Portable candidate (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-26, macos-15-intel]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the declared release compiler
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"

      - name: Prepare pinned modules on the disposable runner
        run: |
          go telemetry off
          go mod download

      - name: Build and verify portable archives offline
        env:
          GOCACHE: ${{ github.workspace }}/.gocache
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          bash scripts/check_test_sandbox.sh
          make package-candidate OUTPUT="$GITHUB_WORKSPACE/dist/candidate"
          bash scripts/check_release_package.sh "$GITHUB_WORKSPACE/dist/candidate"

  tests:
    name: Tests, security and offline runtime
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Prepare verification tools and dependencies
        run: |
          go telemetry off
          brew install bats-core shellcheck coreutils parallel fd gitleaks
          go mod download

      - name: Check destructive sinks and secrets
        run: |
          python3 scripts/audit_destructive_sinks.py
          gitleaks git --redact --no-banner --config .gitleaks.toml --timeout 120

      - name: Build local helpers
        run: make build

      - name: Run the complete fixture suite
        env:
          MOLE_PERF_BYTES_TO_HUMAN_LIMIT_MS: "6000"
          MOLE_PERF_GET_FILE_SIZE_LIMIT_MS: "3000"
          MOLE_PERF_NORMALIZE_PATHS_LIMIT_MS: "10000"
          MOLE_TEST_JOBS: "3"
          MOLE_TEST_REPORT_DIR: ${{ runner.temp }}/bats-report
        run: |
          bash scripts/check_test_sandbox.sh
          ./scripts/test.sh

      - name: Verify offline runtime with disposable fixtures
        run: bash scripts/check_local_offline.sh

  compatibility:
    name: macOS 14 core contracts
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Prepare tools and local helpers
        run: |
          go telemetry off
          brew install bats-core coreutils
          go mod download
          make build

      - name: Run core contracts
        env:
          MOLE_TEST_ANALYZE_BIN: ${{ github.workspace }}/bin/analyze-go
          MOLE_TEST_STATUS_BIN: ${{ github.workspace }}/bin/status-go
          MOLE_PERF_NORMALIZE_PATHS_LIMIT_MS: "10000"
        run: |
          bash scripts/check_test_sandbox.sh
          bash scripts/test_sandbox.sh bats tests/core_safe_functions.bats tests/core_common.bats \
            tests/core_timeout.bats tests/regression.bats tests/cli.bats
