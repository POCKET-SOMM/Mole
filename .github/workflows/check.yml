name: Check

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_ANALYTICS: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  GOTOOLCHAIN: local

jobs:
  quality:
    name: Format, lint and workflow policy
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Prepare verification tools and dependencies
        run: |
          go telemetry off
          brew install shellcheck actionlint
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.13.1
          go install golang.org/x/tools/cmd/goimports@v0.49.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go mod download

      - name: Check formatting
        run: |
          while IFS= read -r -d '' file; do
            shfmt -i 4 -ci -sr -d "$file"
          done < <(find . -type f \( -name '*.sh' -o -name mole \) \
            -not -path './.git/*' -not -path '*/node_modules/*' \
            -not -path '*/tests/tmp-*/*' -not -path '*/.*' -print0)
          UNFORMATTED=$(goimports -l -local github.com/tw93/mole ./cmd ./internal)
          if [[ -n "$UNFORMATTED" ]]; then
            printf '%s\n' "$UNFORMATTED"
            echo 'Run ./scripts/check.sh --format before committing.' >&2
            exit 1
          fi

      - name: Validate workflows and fork permissions
        run: |
          actionlint
          ruby tests/helpers/ci_policy.rb .github/workflows

      - name: Run local quality gates
        env:
          GOPROXY: "off"
          GOSUMDB: "off"
        run: ./scripts/check.sh --no-format
